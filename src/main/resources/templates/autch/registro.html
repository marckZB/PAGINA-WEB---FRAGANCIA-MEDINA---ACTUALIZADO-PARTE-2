<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Medina Fragrances</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <div class="container py-5 d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card border-1 rounded-0 shadow-sm p-4 bg-white">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-uppercase" style="letter-spacing: 2px;">Medina</h2>
                    <p class="text-secondary small text-uppercase">Crear Cuenta Nueva</p>
                </div>

                <!-- Formulario Thymeleaf - envia datos al servidor -->
                <form th:action="@{/auth/registrar}" th:object="${usuario}" method="post">

                    <!-- Nombre Completo -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase">Nombre Completo</label>
                        <input type="text" th:field="*{nombre}"
                               class="form-control rounded-0 border-secondary-subtle"
                               placeholder="Ej. Marco Medina">
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('nombre')}"
                             th:errors="*{nombre}"></div>
                    </div>

                    <!-- DNI -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase">DNI</label>
                        <input type="text" th:field="*{dni}"
                               class="form-control rounded-0 border-secondary-subtle"
                               placeholder="12345678" maxlength="8">
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('dni')}"
                             th:errors="*{dni}"></div>
                        <div class="text-danger small mt-1"
                             th:if="${errorDni}" th:text="${errorDni}"></div>
                    </div>

                    <!-- Correo Electronico -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase">Correo Electrónico</label>
                        <input type="email" th:field="*{email}"
                               class="form-control rounded-0 border-secondary-subtle"
                               placeholder="correo@ejemplo.com">
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>
                        <div class="text-danger small mt-1"
                             th:if="${errorEmail}" th:text="${errorEmail}"></div>
                    </div>

                    <!-- Telefono -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase">Teléfono</label>
                        <input type="text" th:field="*{telefono}"
                               class="form-control rounded-0 border-secondary-subtle"
                               placeholder="987654321" maxlength="9">
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('telefono')}"
                             th:errors="*{telefono}"></div>
                    </div>

                    <!-- Direccion -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase">Dirección</label>
                        <input type="text" th:field="*{direccion}"
                               class="form-control rounded-0 border-secondary-subtle"
                               placeholder="Av. ejemplo 123, Lima">
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('direccion')}"
                             th:errors="*{direccion}"></div>
                    </div>

                    <!-- Contrasena -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-uppercase">Contraseña</label>
                        <input type="password" th:field="*{password}"
                               class="form-control rounded-0 border-secondary-subtle"
                               placeholder="Mínimo 6 caracteres">
                        <div class="text-danger small mt-1"
                             th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}"></div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 rounded-0 py-2 text-uppercase mb-3">
                        Registrarse
                    </button>
                </form>

                <div class="text-center mt-3 border-top pt-3">
                    <p class="small text-secondary mb-1">¿Ya tienes una cuenta?</p>
                    <a href="/login" class="text-dark fw-bold small text-decoration-none">INICIAR SESIÓN</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
