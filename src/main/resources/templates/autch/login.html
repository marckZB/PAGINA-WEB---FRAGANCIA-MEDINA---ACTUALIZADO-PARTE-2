<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Medina Fragrances</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="card border-1 rounded-0 shadow-sm p-4 bg-white">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-uppercase" style="letter-spacing: 2px;">Medina</h2>
                    <p class="text-secondary small text-uppercase">Iniciar Sesión</p>
                </div>

                <!-- Mensaje de exito si viene del registro -->
                <div th:if="${mensajeExito}"
                     class="alert alert-success rounded-0 small py-2" th:text="${mensajeExito}"></div>

                <!-- Mensaje de error de login -->
                <div th:if="${errorLogin}"
                     class="alert alert-danger rounded-0 small py-2" th:text="${errorLogin}"></div>

                <!-- Formulario Thymeleaf -->
                <form th:action="@{/auth/ingresar}" th:object="${usuario}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-uppercase">Correo Electrónico</label>
                        <input type="email" th:field="*{email}"
                               class="form-control rounded-0 border-secondary-subtle"
                               placeholder="usuario@email.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-uppercase">Contraseña</label>
                        <input type="password" th:field="*{password}"
                               class="form-control rounded-0 border-secondary-subtle"
                               required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 rounded-0 py-2 text-uppercase mb-3">
                        Entrar
                    </button>
                </form>

                <div class="text-center mt-3 border-top pt-3">
                    <p class="small text-secondary mb-1">¿Eres nuevo en Medina Fragrances?</p>
                    <a href="/registro" class="text-dark fw-bold small text-decoration-none">CREAR UNA CUENTA</a>
                </div>

                <div class="text-center mt-4">
                    <a href="/" class="text-secondary small text-decoration-none">
                        <i class="bi bi-arrow-left"></i> Volver a la tienda
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
